[global]
    workgroup = WORKGROUP
    server string = Tensor
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB2_10
    load printers = no

    hosts allow = 127.0.0.1 192.168.1.0/24 100.103.67.56 100.96.255.81
    hosts deny = ALL

[home]
    comment = Tensor Home
    path = /home
    browseable = yes
    read only = no

    valid users = iragonforce
    force user = iragonforce
    force group = iragonforce

    root preexec = /usr/bin/mountpoint -q /home
    root preexec close = yes
    wide links = no
