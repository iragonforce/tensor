general = {
    name = "Edifier Speakers";
    service_type = "airplay2";
    output_backend = "pipewire";
    volume_range_db = 30;
    volume_control_profile = "flat";
};

pipewire = {
    application_name = "AirPlay - Edifier";
    sink_target = "alsa_output.usb-Generic_USB_Audio-00.HiFi__SPDIF__sink";
    mixer_type = "sink";
};

metadata = {
    enabled = "yes";
    include_cover_art = "yes";
};

mqtt = {
    enabled = "yes";
    hostname = "192.168.4.4";
    port = 1883;
    topic = "shairport/tensor/edifier";
    publish_parsed = "yes";
    publish_cover = "yes";
    publish_retain = "no";
    enable_remote = "no";
};
