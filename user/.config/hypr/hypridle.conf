# Media-aware idle behavior after 5 minutes.
# Caffeinate selects lock-only or visual standby; media defers both.
general {
    lock_cmd = pidof hyprlock || /home/iragonforce/.config/hypr/scripts/lock-manual.sh
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = /home/iragonforce/.local/bin/tensor-idle-action
    condition_cmd = /home/iragonforce/.local/bin/tensor-idle-media
    condition_retry = 15
    ignore_inhibit = false
}
