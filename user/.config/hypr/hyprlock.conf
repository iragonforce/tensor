# Hyprlock only controls lock-screen visuals and the password box.
# It does not control lock timing; that is handled by hypridle.conf.
background {
    monitor =
    # `path = screenshot` means Hyprlock uses a live snapshot of the current desktop
    # instead of a static wallpaper, then applies blur and dimming on top of it.
    path = screenshot
    blur_passes = 3
    blur_size = 1
    brightness = 0.55
    contrast = 1
    vibrancy = 0.25
}

# Main clock. This is the large hour/minute text in the center of the lock screen.
label {
    monitor = DP-5 
    text = cmd[update:1000] date +"%H:%M"
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    color = rgba(255, 255, 255, 0.95)
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
    position = 0, 250
    halign = center
    valign = center
}

# Secondary seconds label. Offset so it visually tucks into the right side of the main clock.
label {
    monitor = DP-5
    text = cmd[update:1000] date +":%S"
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.4)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 300, 300
    halign = center
    valign = center
}

# Full date line shown under the clock.
label {
    monitor = DP-5
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.6)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 0, 155
    halign = center
    valign = center
}

# Small greeting line above the password field.
label {
    monitor = DP-5 
    text = cmd[update:60000] echo "Welcome back, $USER"
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.35)
    position = 0, 115
    halign = center
    valign = center
}

# Placeholder label block for a user/avatar graphic.
# `text` is intentionally empty right now, so this block only reserves a styling slot.
label {
    monitor = DP-5 
    text =
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    color = rgba(122, 162, 212, 0.7)
    position = 0, 30
    halign = center
    valign = center
}

# Password input field styling.
# This block controls the size, corner radius, placeholder, colors, and failure/success feedback.
input-field {
    monitor = DP-5 
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = true
    hide_input = false
    rounding = 14
    outer_color = rgba(190, 190, 190, 0.2)
    inner_color = rgba(110, 110, 110, 0.2)
    font_color = rgba(255, 255, 255, 0.9)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(166, 227, 161, 0.5)
    fail_color = rgba(243, 139, 168, 0.5)
    fail_text = <i>$FAIL</i>
    capslock_color = rgba(249, 226, 175, 0.5)
    position = 0, -40
    halign = center
    valign = center
}

# Keyboard layout indicator. Pulls the active keymap from `hyprctl devices -j`
# so you can see whether the lock screen is using US or RU before typing.
label {
    monitor = DP-5 
    text = cmd[update:500] hyprctl devices -j | grep -A2 '"main": true' | grep "active_keymap" | cut -d'"' -f4 | head -1
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    color = rgba(190, 190, 190, 0.20)
    position = 0, -85
    halign = center
    valign = center
}
