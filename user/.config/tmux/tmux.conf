#### Generated baseline from ~/tmux-g.md

# Shell and terminal behavior
set-option -g default-command ''
set-option -g default-terminal 'tmux-256color'
set-option -sa terminal-features ',xterm*:RGB,ghostty*:RGB,tmux*:RGB'
set-option -sa terminal-overrides ',*:Tc'
set-option -g default-size 80x24
set-option -g history-limit 3000
set-option -g destroy-unattached off
set-option -g detach-on-destroy off
set-option -g renumber-windows off

# Input
set-option -g prefix C-b
set-option -g prefix2 None
set-option -g status-keys vi
# Mouse capture is enabled for pane and application clicks.
set-option -g mouse on
set-option -g window-style 'fg=default,bg=default'
set-option -g window-active-style 'fg=default,bg=default'
set-option -g repeat-time 500
set-option -gq initial-repeat-time 0

# Messages and panes
set-option -g display-panes-active-colour red
set-option -g display-panes-colour blue
set-option -g display-panes-time 1000
set-option -g display-time 750
set-option -g message-style 'bg=yellow,fg=black,fill=yellow'
set-option -g message-command-style 'bg=black,fg=yellow,fill=black'

# Status bar
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 1
set-option -g status-justify left
set-option -g status-left '[#{host_short}] '
set-option -g status-left-length 12
set-option -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} %H:%M:%S %d-%b-%y'
set-option -g status-right-length 40
set-option -g status-style 'bg=default,fg=#ffff00'
set-window-option -g window-status-style 'fg=#ffffff,bg=default'
set-window-option -g window-status-current-style 'fg=#ffff00,bg=default,bold'
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-current-format ' #I:#W '

# Window titles
set-option -g set-titles off
set-option -g set-titles-string '#S:#I:#W - "#T" #{session_alerts}'
set -g base-index 1
setw -g pane-base-index 1

# Alerts
set-option -g bell-action any
set-option -g silence-action other
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off

# Copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane
set -g set-clipboard on


# Copy selected text to the macOS clipboard with c in copy mode.
bind-key -T copy-mode-vi c send-keys -X copy-pipe-and-cancel '$HOME/.config/tmux/clipboard.py copy "#{session_name}"'
bind-key -T copy-mode c send-keys -X copy-pipe-and-cancel '$HOME/.config/tmux/clipboard.py copy "#{session_name}"'
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel '$HOME/.config/tmux/clipboard.py copy "#{session_name}"'
bind-key -T copy-mode C-c send-keys -X copy-pipe-and-cancel '$HOME/.config/tmux/clipboard.py copy "#{session_name}"'

# On-demand clipboard handling differs on Nexus's tmux 3.5a.

# Keep mouse actions out of tmux copy mode.

# capture-clipboard begin
set -s set-clipboard on
set -as terminal-features ',xterm-ghostty:clipboard'
set -as terminal-features ',tmux-256color:clipboard'
set -as terminal-features ',screen-256color:clipboard'
# capture-clipboard end

# Unified SSH selector (window 0, native tmux menu)

# === CLIPBOARD ===
# On-demand clipboard integration. Loaded after the shared tmux baseline.
set -g @tmux-copy-enabled on
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard,ghostty*:clipboard,tmux*:clipboard'

# Legacy Ghostty private keys remain for older clients; current clients send Shift-F1/F2.
set -s user-keys[40] "\033[77101~"
set -s user-keys[41] "\033[77102~"
bind -T root User40 display-message -d 5000 'Drag over text first, then Cmd/Super+C to copy'
bind -T root User41 run-shell -b '$HOME/.config/tmux/clipboard.py paste #{q:session_name} #{pane_id}'
bind ] run-shell -b '$HOME/.config/tmux/clipboard.py paste #{q:session_name} #{pane_id}'

# These older drag bindings are inert while mouse capture is off.
bind -T root MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

bind -T copy-mode User40 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode-vi User40 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode S-F1 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode-vi S-F1 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode S-F2 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode-vi S-F2 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode c send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode-vi c send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode y send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel -C -P '$HOME/.config/tmux/clipboard.py copy #{q:session_name}'
bind -T copy-mode C-c send-keys -X cancel
bind -T copy-mode-vi C-c send-keys -X cancel
bind -T copy-mode User41 send-keys -X cancel \; run-shell -b '$HOME/.config/tmux/clipboard.py paste #{q:session_name} #{pane_id}'
bind -T copy-mode-vi User41 send-keys -X cancel \; run-shell -b '$HOME/.config/tmux/clipboard.py paste #{q:session_name} #{pane_id}'

# Ordinary status bar when idle; copy feedback uses a timed tmux message only.
set -g status on
set -g status-position bottom
set -g display-time 2000
# Keep yellow behind message text only; preserve the surrounding status bar.
set -g message-style 'bg=yellow,fg=black'

# === MOUSE ===
# Keep pane, status-line, and application mouse actions without entering copy mode.
set -g mouse on
bind -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind -T root MouseDrag1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b true'
bind -T root WheelUpPane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b true'
bind -T root WheelDownPane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b true'
unbind -q -T root MouseDrag1ScrollbarSlider

# Ghostty's own scrollback is available when mouse reporting is toggled off.
# Keep the tmux client on Ghostty's primary screen for that scrollback.
set -ga terminal-overrides ',xterm-ghostty:smcup@:rmcup@'

# === SSH MENU ===
# Portable SSH menu for qubit, tensor and nexus.
# Client-scoped detach; no nested tmux.
set -g mouse on

bind-key -T prefix 0 display-menu -T 'SSH | from #{host_short}' -x C -y C \
  '#{?#{==:#{host_short},qubit},-qubit,qubit}' q 'detach-client -E "$HOME/.config/tmux/remote qubit #{client_session} #{socket_path}"' \
  '#{?#{==:#{host_short},tensor},-tensor,tensor}' t 'detach-client -E "$HOME/.config/tmux/remote tensor #{client_session} #{socket_path}"' \
  '#{?#{==:#{host_short},nexus},-nexus,nexus}' n 'detach-client -E "$HOME/.config/tmux/remote nexus #{client_session} #{socket_path}"'

bind-key -T prefix S display-menu -T 'SSH | from #{host_short}' -x C -y C \
  '#{?#{==:#{host_short},qubit},-qubit,qubit}' q 'detach-client -E "$HOME/.config/tmux/remote qubit #{client_session} #{socket_path}"' \
  '#{?#{==:#{host_short},tensor},-tensor,tensor}' t 'detach-client -E "$HOME/.config/tmux/remote tensor #{client_session} #{socket_path}"' \
  '#{?#{==:#{host_short},nexus},-nexus,nexus}' n 'detach-client -E "$HOME/.config/tmux/remote nexus #{client_session} #{socket_path}"'

# Preserve native clicks on other status-bar windows.
bind-key -T root MouseDown1Status switch-client -t=

# Dedicated range used by 999:ssh / 0:[ssh].
bind-key -T root MouseDown1Control0 display-menu -O -M -T 'SSH | from #{host_short}' -x C -y C \
  '#{?#{==:#{host_short},qubit},-qubit,qubit}' q 'detach-client -E "$HOME/.config/tmux/remote qubit #{client_session} #{socket_path}"' \
  '#{?#{==:#{host_short},tensor},-tensor,tensor}' t 'detach-client -E "$HOME/.config/tmux/remote tensor #{client_session} #{socket_path}"' \
  '#{?#{==:#{host_short},nexus},-nexus,nexus}' n 'detach-client -E "$HOME/.config/tmux/remote nexus #{client_session} #{socket_path}"'
