monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_82_00.1.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Generic_USB_Audio-00.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-beyerdynamic_GmbH___Co._KG_beyerdynamic_PRO_X_004900-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
